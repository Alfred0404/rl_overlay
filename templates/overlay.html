<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RL Overlay</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @font-face {
        font-family: "Bourgeois Bold Italic";
        src: url("/Bourgeois-BoldItalic.ttf") format("truetype");
        font-weight: normal;
        font-style: normal;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      body {
        font-family: "Bourgeois Bold Italic", serif;
        position: relative;
        background: transparent;
      }
      .bg-layer {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <img src="/gameplay.png" alt="Fond de gameplay" class="bg-layer" />

    <div class="relative z-10 w-full text-white flex flex-col">
      <!-- Score and Teams Band -->
      <div
        class="pointer-events-none w-full flex items-stretch justify-center h-20"
      >
        <div class="bg-black/70 h-full backdrop-blur-sm">
          <div
            class="flex h-full items-stretch justify-center gap-0 text-center"
          >
            <div
              id="team1-series"
              class="w-3 h-full flex flex-col items-center gap-0.5"
            ></div>
            <div
              class="flex h-full w-[320px] shrink-0 items-stretch justify-center gap-0"
            >
              <div
                id="team1-logo"
                class="h-full aspect-square bg-white/0 overflow-hidden flex items-center justify-center ml-0 p-2"
              ></div>
              <div
                id="team1-name"
                class="h-full w-[190px] shrink-0 text-center mx-3 text-[40px] font-semibold uppercase text-white drop-shadow-lg flex items-center justify-center whitespace-nowrap"
              >
                —
              </div>
            </div>
            <div
              id="team1-score"
              class="h-full min-w-14 px-4 flex items-center justify-center text-5xl font-black tracking-tight text-white drop-shadow-lg"
            >
              0
            </div>
            <div
              class="h-full flex-1 min-w-0 bg-white/0 text-center flex items-stretch justify-center"
            >
              <div
                id="time"
                class="h-full w-full px-6 flex items-center justify-center text-3xl font-black leading-none text-black bg-white"
              >
                —
              </div>
            </div>
            <div
              id="team2-score"
              class="h-full min-w-14 px-4 flex items-center justify-center text-5xl font-black tracking-tight text-white drop-shadow-lg"
            >
              0
            </div>
            <div
              class="flex h-full w-[320px] shrink-0 items-stretch justify-center gap-0"
            >
              <div
                id="team2-name"
                class="h-full w-[190px] shrink-0 text-center mx-3 text-[40px] font-semibold uppercase text-white drop-shadow-lg flex items-center justify-center whitespace-nowrap"
              >
                —
              </div>
              <div
                id="team2-logo"
                class="h-full aspect-square bg-white/0 overflow-hidden flex items-center justify-center mr-0 p-2"
              ></div>
            </div>
            <div
              id="team2-series"
              class="w-3 h-full flex flex-col items-center gap-0.5"
            ></div>
          </div>
        </div>
      </div>

      <!-- Players Container -->
      <div
        class="pointer-events-none flex-1 w-full flex items-start justify-between -translate-y-12"
      >
        <div class="w-56">
          <div
            id="team1-players"
            class="space-y-1 text-lg font-semibold leading-tight drop-shadow-lg"
          ></div>
        </div>

        <div class="w-56 text-right">
          <div
            id="team2-players"
            class="space-y-1 text-lg font-semibold leading-tight drop-shadow-lg"
          ></div>
        </div>
      </div>
    </div>

    <script>
      const team1PlayersEl = document.getElementById("team1-players");
      const team2PlayersEl = document.getElementById("team2-players");
      const team1NameEl = document.getElementById("team1-name");
      const team2NameEl = document.getElementById("team2-name");
      const team1LogoEl = document.getElementById("team1-logo");
      const team2LogoEl = document.getElementById("team2-logo");
      const team1SeriesEl = document.getElementById("team1-series");
      const team2SeriesEl = document.getElementById("team2-series");
      const team1ScoreEl = document.getElementById("team1-score");
      const team2ScoreEl = document.getElementById("team2-score");
      const timeEl = document.getElementById("time");

      function normalizeTime(value) {
        if (value === null || value === undefined || Number.isNaN(value)) {
          return "—";
        }
        const seconds = Math.max(0, Math.round(value));
        const minutes = Math.floor(seconds / 60);
        const secs = seconds % 60;
        return `${minutes}:${secs.toString().padStart(2, "0")}`;
      }

      function playerName(player) {
        return player.Name ?? player.name ?? "Unknown";
      }

      function fitTextToWidth(element, maxFontSize = 40, minFontSize = 24) {
        if (!element) {
          return;
        }

        element.style.fontSize = `${maxFontSize}px`;
        let fontSize = maxFontSize;
        while (
          fontSize > minFontSize &&
          element.scrollWidth > element.clientWidth
        ) {
          fontSize -= 1;
          element.style.fontSize = `${fontSize}px`;
        }
      }

      function renderSeriesBoxes(wins, bestOf = 3, team = 0) {
        const totalBoxes = Math.max(1, bestOf);
        const filledBoxes = Math.max(
          0,
          Math.min(totalBoxes, Number(wins) || 0),
        );
        const teamColor = teamBackgroundColor(team);
        return Array.from({ length: totalBoxes }, (_, index) => {
          const filled = index < filledBoxes;
          const boxStyle = filled
            ? `background-color: ${teamColor};`
            : `background-color: rgba(0, 0, 0, 0);`;
          return `<div class="flex-1 w-3 w-full" style="${boxStyle}"></div>`;
        }).join("");
      }

      function teamKey(player) {
        return Number(player.TeamNum ?? player.team ?? -1);
      }

      function teamBackgroundColor(team) {
        return team === 0
          ? "rgba(0, 95, 227, 0.92)"
          : "rgba(255, 115, 40, 0.92)";
      }

      function renderPlayerWithBoost(player, reverse = false) {
        const name = playerName(player);
        const team = teamKey(player);
        const boost = Math.min(100, Math.max(0, player.Boost ?? 0));
        const color = "#22c55e"; // green
        return `
          <div class="bg-black/70">
            <div class="w-full h-2 overflow-hidden" style="background-color: rgba(255, 255, 255, 0);">
              <div
                style="width: ${boost}%; background-color: ${teamBackgroundColor(team)}; height: 100%; transition: width 0.1s linear; ${reverse ? "margin-left: auto;" : ""}"
              ></div>
            </div>
            <div class="text-white px-2 py-1 uppercase">${name}</div>
          </div>
        `;
      }

      function render(state) {
        const score = state.score || { blue: 0, orange: 0 };
        const teams = state.teams || { blue: "Blue", orange: "Orange" };
        const seriesWins = state.series_wins || { blue: 0, orange: 0 };
        const bestOf = Number(
          state.best_of ?? state.bestOf ?? state.match_best_of ?? 3,
        );
        const eventTitle = state.event_title || state.event_name || "";
        const players = Array.isArray(state.players) ? state.players : [];
        const team1Players = players.filter((player) => teamKey(player) === 0);
        const team2Players = players.filter((player) => teamKey(player) === 1);

        team1NameEl.textContent = (teams.blue || "Blue").toUpperCase();
        team2NameEl.textContent = (teams.orange || "Orange").toUpperCase();
        team1NameEl.style.backgroundColor = "transparent";
        team2NameEl.style.backgroundColor = "transparent";
        team1SeriesEl.innerHTML = renderSeriesBoxes(
          seriesWins.blue ?? 0,
          bestOf,
          0,
        );
        team2SeriesEl.innerHTML = renderSeriesBoxes(
          seriesWins.orange ?? 0,
          bestOf,
          1,
        );
        team1LogoEl.innerHTML = `
          <img
            src="/logo_vitality.png"
            alt="Logo Vitality"
            class="h-full w-full object-contain"
          />
        `;
        team2LogoEl.innerHTML = `
          <img
            src="/logo_nrg.png"
            alt="Logo NRG"
            class="h-full w-full object-contain"
          />
        `;
        team1ScoreEl.style.backgroundColor = teamBackgroundColor(0);
        team2ScoreEl.style.backgroundColor = teamBackgroundColor(1);
        team1ScoreEl.textContent = score.blue ?? 0;
        team2ScoreEl.textContent = score.orange ?? 0;
        timeEl.textContent = normalizeTime(state.time_seconds);

        fitTextToWidth(team1NameEl);
        fitTextToWidth(team2NameEl);

        const team1Html = team1Players
          .map((player) => renderPlayerWithBoost(player))
          .join("");
        const team2Html = team2Players
          .map((player) => renderPlayerWithBoost(player, true))
          .join("");

        if (team1PlayersEl.innerHTML !== team1Html) {
          team1PlayersEl.innerHTML = team1Html;
        }
        if (team2PlayersEl.innerHTML !== team2Html) {
          team2PlayersEl.innerHTML = team2Html;
        }
      }

      const proto = location.protocol === "https:" ? "wss" : "ws";
      const ws = new WebSocket(`${proto}://${location.host}/ws`);

      ws.addEventListener("message", (ev) => {
        try {
          render(JSON.parse(ev.data));
        } catch (error) {
          console.error(error);
        }
      });

      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(() => {
          fitTextToWidth(team1NameEl);
          fitTextToWidth(team2NameEl);
        });
      }

      window.addEventListener("resize", () => {
        fitTextToWidth(team1NameEl);
        fitTextToWidth(team2NameEl);
      });
    </script>
  </body>
</html>
